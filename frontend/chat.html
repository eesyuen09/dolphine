<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoomMatch AI | Interactive Mode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <nav class="top-nav" aria-label="RoomMatch navigation">
      <a href="index.html">RoomMatch AI</a>
      <div>
        <a class="active" href="chat.html">Interactive mode</a>
        <a href="metric.html">Metric mode</a>
      </div>
    </nav>

    <section class="chat-workspace" aria-label="Interactive recommendation workspace">
      <section class="chat-panel">
        <div class="panel-heading">
          <p class="eyebrow">Interactive mode</p>
          <h1>Tell the AI room scout what you need.</h1>
          <p class="chat-subtitle">Use natural language, quick prompts, or both. The assistant converts your request into searchable tenant metrics.</p>
        </div>

        <div id="chat-log" class="chat-log" aria-live="polite"></div>

        <div class="prompt-chips" aria-label="Quick prompts">
          <button type="button" data-prompt="I want a room under 1200 near Buona Vista, aircon required, close to MRT and food court.">Buona Vista under $1,200</button>
          <button type="button" data-prompt="Prioritise comfort, private bathroom, cooking allowed, and good food nearby. Budget can go up to 1800.">Comfort first</button>
          <button type="button" data-prompt="I need the cheapest room possible with fast Wi-Fi and less than 5 minutes walk to MRT.">Cheapest MRT option</button>
        </div>

        <form id="chat-form" class="chat-form">
          <input id="chat-input" type="text" value="I want a room under 1200 near Buona Vista, aircon required, close to MRT and food court." aria-label="Tenant room request">
          <button type="submit">Recommend</button>
        </form>
      </section>

      <section class="results-panel chat-results">
        <div class="results-toolbar">
          <div>
            <p class="eyebrow">AI interpretation</p>
            <h2>Detected needs and best matches</h2>
          </div>
          <a class="secondary-link" href="metric.html">Tune metrics</a>
        </div>

        <div id="detected-metrics" class="detected-metrics"></div>
        <div id="chat-room-list" class="room-list" aria-live="polite"></div>
      </section>
    </section>
  </main>

  <script src="chat.js"></script>
</body>
</html>
